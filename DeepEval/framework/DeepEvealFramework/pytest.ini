[pytest]
testpaths = tests
markers =
    chatbot: tests that target the support chatbot
    quality: answer-quality metrics
    safety: adversarial / harmful-content metrics
    security: attack-technique, misuse and role-violation tests
    conversation: multi-turn metrics
    slow: makes LLM calls to both the bot and the judge
    needs_chatbot: requires GROQ_API_KEY and a reachable chatbot
filterwarnings =
    ignore::DeprecationWarning
