<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Customer Support</title>
<style>
  :root {
    --bg: #f4f5f8;
    --surface: #ffffff;
    --text: #1b2130;
    --muted: #667085;
    --border: #e2e5ec;
    --accent: #3b5bdb;
    --accent-hover: #3050c4;
    --on-accent: #ffffff;
    --bot-bg: #ffffff;
    --user-bg: #3b5bdb;
    --user-text: #ffffff;
    --code-bg: #eef0f5;
    --error-bg: #fdecec;
    --error-text: #a12626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --surface: #161a22;
      --text: #e7eaf1;
      --muted: #98a2b3;
      --border: #2a303c;
      --accent: #7f97ff;
      --accent-hover: #9aacff;
      --on-accent: #0e1116;
      --bot-bg: #1c212b;
      --user-bg: #3d55c9;
      --user-text: #ffffff;
      --code-bg: #262c38;
      --error-bg: #3a1c1f;
      --error-text: #ffb4b4;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 780px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 650; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

  button { font: inherit; cursor: pointer; }
  button:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .ghost {
    background: none;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    white-space: nowrap;
  }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }

  .bubble {
    max-width: min(85%, 600px);
    padding: 10px 14px;
    border-radius: 16px;
    overflow-wrap: anywhere;
  }
  .bot .bubble {
    background: var(--bot-bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .user .bubble {
    background: var(--user-bg);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
    white-space: pre-wrap;
  }
  .error .bubble {
    background: var(--error-bg);
    color: var(--error-text);
    border: 1px solid transparent;
    border-bottom-left-radius: 4px;
  }

  .bubble p { margin: 0 0 8px; }
  .bubble ul, .bubble ol { margin: 0 0 8px; padding-left: 22px; }
  .bubble li { margin: 2px 0; }
  .bubble > :last-child { margin-bottom: 0; }
  .bubble code {
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 4px;
    font: 0.92em ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .bubble a { color: var(--accent); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    background: none;
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 14px;
  }
  .chip:hover { border-color: var(--accent); }

  .typing .bubble { display: flex; gap: 5px; padding: 14px 16px; }
  .typing i {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: 0.2s; }
  .typing i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .typing i { animation: none; opacity: 0.6; }
    #log { scroll-behavior: auto; }
  }

  form {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
  }
  textarea {
    flex: 1;
    resize: none;
    max-height: 140px;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  textarea::placeholder { color: var(--muted); }
  #send {
    background: var(--accent);
    color: var(--on-accent);
    border: 0;
    border-radius: 12px;
    padding: 10px 18px;
    font-weight: 600;
  }
  #send:hover:not(:disabled) { background: var(--accent-hover); }
  #send:disabled { opacity: 0.45; cursor: not-allowed; }

  .hint { padding: 0 16px 10px; font-size: 12px; color: var(--muted); text-align: center; }

  @media (max-width: 600px) {
    .app { border: 0; }
    .bubble { max-width: 92%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Customer Support</h1>
      <p>Orders, shipping, returns, refunds and your account</p>
    </div>
    <button class="ghost" id="new-chat" type="button">New chat</button>
  </header>

  <main id="log" role="log" aria-live="polite" aria-label="Conversation"></main>

  <form id="composer" autocomplete="off">
    <textarea id="input" rows="1" maxlength="2000" placeholder="Type your question..." aria-label="Your message"></textarea>
    <button id="send" type="submit" disabled>Send</button>
  </form>
  <div class="hint">Enter to send &middot; Shift+Enter for a new line</div>
</div>

<script>
  const SUGGESTIONS = [
    "How long do refunds take?",
    "What's your return policy?",
    "How much is shipping?",
    "How do I reset my password?",
  ];

  const log = document.getElementById("log");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const newChatBtn = document.getElementById("new-chat");

  // A new id per page load: the server keeps the conversation history for this id,
  // so reloading the page starts a fresh chat (matching the empty screen).
  const sessionId = crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now() + "-" + Math.random().toString(36).slice(2);
  let busy = false;

  // ---- tiny markdown renderer -------------------------------------------------------
  // Escapes ALL html first, then adds only the few tags we generate ourselves, so model
  // output can never inject markup. Supports **bold**, `code`, lists, links to emails/URLs.
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function inline(s) {
    return escapeHtml(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\b([\w.+-]+@[\w-]+(?:\.[\w-]+)+)\b/g, '<a href="mailto:$1">$1</a>')
      .replace(
        /\b((?:[a-z0-9-]+\.)+(?:com|org|net|io)\/[^\s<]*[^\s<.,;:!?)])/gi,
        '<a href="https://$1" target="_blank" rel="noopener noreferrer">$1</a>'
      );
  }

  function renderMarkdown(text) {
    const out = [];
    let list = null;
    let para = [];
    const flushPara = () => {
      if (para.length) out.push("<p>" + para.map(inline).join("<br>") + "</p>");
      para = [];
    };
    const flushList = () => {
      if (list) {
        out.push(`<${list.tag}>` + list.items.map((i) => `<li>${inline(i)}</li>`).join("") + `</${list.tag}>`);
      }
      list = null;
    };

    for (const raw of text.split("\n")) {
      const line = raw.trimEnd();
      const bullet = line.match(/^\s*[-*•]\s+(.*)$/);
      const numbered = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (bullet || numbered) {
        flushPara();
        const tag = bullet ? "ul" : "ol";
        if (list && list.tag !== tag) flushList();
        if (!list) list = { tag, items: [] };
        list.items.push((bullet || numbered)[1]);
      } else if (!line.trim()) {
        flushPara();
        flushList();
      } else {
        flushList();
        para.push(line);
      }
    }
    flushPara();
    flushList();
    return out.join("");
  }

  // ---- UI helpers -------------------------------------------------------------------
  function scrollToBottom() {
    log.scrollTop = log.scrollHeight;
  }

  function addMessage(kind, text) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + kind;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (kind === "bot") bubble.innerHTML = renderMarkdown(text);
    else bubble.textContent = text; // user + error text is never treated as HTML
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function addTyping() {
    const wrap = document.createElement("div");
    wrap.className = "msg bot typing";
    wrap.setAttribute("aria-label", "Assistant is typing");
    wrap.innerHTML = '<div class="bubble"><i></i><i></i><i></i></div>';
    log.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function showWelcome() {
    const wrap = addMessage(
      "bot",
      "Hi! I'm the support assistant. Ask me about orders, shipping, returns, refunds or your account."
    );
    wrap.id = "welcome";
    const chips = document.createElement("div");
    chips.className = "chips";
    for (const q of SUGGESTIONS) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = q;
      b.addEventListener("click", () => send(q));
      chips.appendChild(b);
    }
    wrap.querySelector(".bubble").appendChild(chips);
  }

  function updateSendState() {
    sendBtn.disabled = busy || !input.value.trim();
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  }

  // ---- chat -------------------------------------------------------------------------
  async function send(raw) {
    const text = raw.trim();
    if (!text || busy) return;

    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    addMessage("user", text);
    input.value = "";
    autosize();
    busy = true;
    updateSendState();
    const typing = addTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      const data = await res.json().catch(() => ({}));
      typing.remove();
      if (res.ok) addMessage("bot", data.reply);
      else addMessage("error", data.error || `Something went wrong (HTTP ${res.status}). Please try again.`);
    } catch {
      typing.remove();
      addMessage("error", "Can't reach the server. Is app.py still running?");
    } finally {
      busy = false;
      updateSendState();
      input.focus();
    }
  }

  async function newChat() {
    if (busy) return;
    log.innerHTML = "";
    showWelcome();
    input.focus();
    try {
      await fetch("/api/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId }),
      });
    } catch {
      /* server unreachable: the next message will surface that error */
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    send(input.value);
  });
  input.addEventListener("input", () => {
    autosize();
    updateSendState();
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send(input.value);
    }
  });
  newChatBtn.addEventListener("click", newChat);

  showWelcome();
  input.focus();
</script>
</body>
</html>
